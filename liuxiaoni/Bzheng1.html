<html lang="zh-CN">
<head>

    <title>B证题库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            /* 禁止选中文字 */
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --primary: #165DFF;
            --success: #00B42A;
            --danger: #F53F3F;
            --gray: #86909C;
            --light: #F2F3F5;
            --white: #FFFFFF;
            --text: #1D2129;
        }

        body {
            background-color: var(--light);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        /* 题型切换 */
        .type-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .tab-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: var(--light);
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            box-shadow: none !important;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--light);
            border-radius: 3px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            color: var(--gray);
            font-size: 14px;
        }

        .question-box {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
        }

        .question {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text);
            font-weight: 500;
        }

        .options {
            margin: 20px 0;
        }

        .option {
            display: block;
            padding: 16px;
            margin: 12px 0;
            background: var(--light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            font-size: 16px;
        }

        .option.selected {
            background: #E8F3FF;
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: none !important; /* 按钮无阴影 */
        }

        #prev {
            background: var(--gray);
            color: white;
        }

        #submit {
            background: var(--danger);
            color: white;
        }

        #next {
            background: var(--primary);
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
            text-align: center;
            font-size: 16px;
        }

        .correct {
            background: #E8FFEE;
            color: var(--success);
        }

        .wrong {
            background: #FFECE8;
            color: var(--danger);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .title {
                font-size: 20px;
            }
            .question {
                font-size: 16px;
            }
            .option {
                padding: 14px;
                font-size: 15px;
            }
            button {
                padding: 12px 20px;
                font-size: 15px;
                flex: 1;
                min-width: 100px;
            }
            .container {
                padding: 18px;
            }
            .tab-btn {
                padding: 8px 16px;
                font-size: 15px;
            }
        }
    </style>
</head>

    </div>

// ===================== 核心程序（无需修改） =====================
const letters = ["A", "B", "C", "D"];
let currentType = "choice"; // 默认选择题
let currentQuestions = []; // 当前题型题目
let currentIndex = 0;
let totalQuestions = 0;

// 初始化
window.onload = () => {
    switchType(currentType);
    // 绑定题型切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            switchType(btn.dataset.type);
        }
    });
};

// 切换题型
function switchType(type) {
    currentType = type;
    currentQuestions = [...questionBank[type]].sort(() => Math.random() - 0.5); // 随机排序
    currentIndex = 0;
    totalQuestions = currentQuestions.length;
    document.getElementById("total").innerText = totalQuestions;
    renderQuestion();
}

// 渲染题目
function renderQuestion() {
    if (currentIndex >= totalQuestions && totalQuestions > 0) {
        alert("🎉 该题型所有题目已刷完！");
        return;
    }
    if (totalQuestions === 0) {
        document.getElementById("question").innerText = "暂无题目";
        document.getElementById("options").innerHTML = "";
        return;
    }

    const item = currentQuestions[currentIndex];
    document.getElementById("current").innerText = currentIndex + 1;
    document.getElementById("question").innerText = item[0];
    document.getElementById("result").style.display = "none";
    document.getElementById("submit").disabled = false;
    document.getElementById("next").disabled = true;

    // 进度条
    const progress = ((currentIndex + 1) / totalQuestions) * 100;
    document.getElementById("progress").style.width = progress + "%";

    // 渲染选项
    const optBox = document.getElementById("options");
    optBox.innerHTML = "";
    item[1].forEach((opt, index) => {
        const div = document.createElement("div");
        div.className = "option";
        const label = currentType === "choice" ? `${letters[index]}. ` : "";
        div.innerText = label + opt[0];
        div.dataset.ans = opt[0];
        div.onclick = () => {
            document.querySelectorAll(".option").forEach(i => i.classList.remove("selected"));
            div.classList.add("selected");
        };
        optBox.appendChild(div);
    });

    // 按钮状态
    document.getElementById("prev").disabled = currentIndex === 0;
}

// 获取正确答案
function getCorrectAns() {
    const opts = currentQuestions[currentIndex][1];
    const target = opts.find(i => i[1] === "yes");
    return target[0];
}

// 提交答案
document.getElementById("submit").onclick = function () {
    const selected = document.querySelector(".option.selected");
    if (!selected) {
        alert("请选择答案！");
        return;
    }
    this.disabled = true;
    const userAns = selected.dataset.ans;
    const correctAns = getCorrectAns();
    const res = document.getElementById("result");

    if (userAns === correctAns) {
        res.className = "result correct";
        res.innerText = "✅ 回答正确！";
    } else {
        res.className = "result wrong";
        res.innerText = `❌ 错误，正确答案：${correctAns}`;
    }
    res.style.display = "block";
    document.getElementById("next").disabled = false;
};

// 上一题/下一题
document.getElementById("prev").onclick = () => { currentIndex--; renderQuestion(); };
document.getElementById("next").onclick = () => { currentIndex++; renderQuestion(); };
