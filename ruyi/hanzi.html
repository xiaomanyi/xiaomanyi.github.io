<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="../js/check.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汉字</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            -webkit-touch-callout: none !important;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #fdf6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation !important;
            overscroll-behavior: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 100vh;
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* padding: 25px; */
        }

        /* 左上方精致返回按钮 */
        #backBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            border: none;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            color: #333;
            cursor: pointer;
            display: none;
        }
        #backBtn:active {
            transform: scale(0.95);
        }

        #progress {
            font-size: 17px;
            color: #666;
            margin-bottom: 30px;
        }

        #wordBox {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 260px;
            margin: 0 auto 60px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 110px;
            font-weight: bold;
            color: #222;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .btns {
            display: flex;
            gap: 35px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            width: 75px;
            height: 75px;
            font-size: 32px;
            border: none !important;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none !important;
            outline: none !important;
            -webkit-box-shadow: none !important;
        }
        .btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .btn-yes {
            background: #a8e6cf;
            color: #1f5f42;
        }

        .btn-no {
            background: #ffb5b5;
            color: #7a2020;
        }

        /* 模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modalContent {
            background: white;
            padding: 32px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
        }

        /* TAB切换 */
        .tab-bar {
            display: flex;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #f3e5ff;
        }
        .tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
        }
        .tab.active {
            background: #d49eff;
            color: white;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }

        /* 学习模式总识字环形图 */
        .study-total-box {
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .study-total-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: conic-gradient(#b666f2 0%, #e8c8ff 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .study-total-circle::before {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            background: #fff;
            border-radius: 50%;
        }
        .study-total-inner {
            position: relative;
            z-index: 10;
            text-align: center;
        }
        .study-total-num {
            font-size: 46px;
            font-weight: bold;
            color: #b666f2;
        }
        .study-total-text {
            font-size: 15px;
            color: #666;
            margin-top: 4px;
        }

        select, input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            margin: 10px 0 22px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .startBtn, .studyBtn, .clearStudyBtn, .fullBtn {
            width: 100%;
            padding: 16px;
            background: #d49eff;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border: none !important;
            border-radius: 12px;
            margin-top: 10px;
            box-shadow: none !important;
            outline: none !important;
        }
        .clearStudyBtn {
            background: #ff8a8a;
        }
        .startBtn:active, .studyBtn:active, .clearStudyBtn:active, .fullBtn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        /* 结果页 */
        .result {
            display: none;
            text-align: center;
            animation: bounceIn 0.7s ease forwards;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .result p {
            font-size: 20px;
            margin: 10px 0;
        }

        .rate-circle {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: conic-gradient(#b666f2 0%, #e8c8ff 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .rate-circle::before {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            background: #fff;
            border-radius: 50%;
        }
        .rate-inner {
            position: relative;
            z-index: 10;
            text-align: center;
        }
        .rate-num {
            font-size: 46px;
            font-weight: bold;
            color: #b666f2;
        }
        .rate-text {
            font-size: 15px;
            color: #666;
            margin-top: 4px;
            line-height: 1.4;
        }

        #levelText {
            font-size: 24px;
            font-weight: bold;
            color: #b666f2;
            margin: 18px 0;
        }

        #wrongWordsBox {
            margin: 22px 0;
            font-size: 18px;
            color: #333;
            word-break: break-all;
            padding: 18px;
            background: #f8f0ff;
            border-radius: 12px;
            text-align: center;
        }

        /* 学习模式 */
        .study-screen {
            display: none;
            height: 100%;
            overflow-y: auto;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* padding: 20px; */
            width: 100%;
        }
        .study-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        .study-title {
            font-size: 20px;
            font-weight: bold;
            color: #b666f2;
        }
        .study-progress {
            font-size: 16px;
            color: #666;
        }
        .study-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 10px;
            width: 100%;
            padding: 0 20px;
        }
        .study-word {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.07);
            cursor: pointer;
        }
        .study-word.known {
            background: #a8e6cf;
            color: #1f5f42;
        }

        /* 分页栏 */
        .page-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 24px;
            width: 100%;
            padding: 0 20px;
        }
        .page-btn {
            padding: 12px 20px;
            background: #d49eff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }
        .page-info {
            font-size: 15px;
            color: #666;
            padding: 0 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 左上方精致返回按钮 ← -->
        <button id="backBtn">←</button>

        <!-- 游戏界面 -->
        <div id="gameScreen">
            <div id="progress">第 0 / 0 字</div>
            <div id="wordBox">字</div>
            <div class="btns">
                <button class="btn btn-yes" onclick="know()">✓</button>
                <button class="btn btn-no" onclick="unknown()">✖️</button>
            </div>
        </div>

        <!-- 结果界面 -->
        <div class="result" id="resultScreen">
            <div class="rate-circle">
                <div class="rate-inner">
                    <div class="rate-num" id="showRateNum">0%</div>
                    <div class="rate-text">
                        <div id="showCountNum">预估 0 字</div>
                        <div>本字库识字率</div>
                    </div>
                </div>
            </div>
            <p id="totalText"></p>
            <p id="rateText"></p>
            <p id="levelText"></p>
            <div id="wrongWordsBox"></div>
            <!-- <button class="fullBtn" onclick="showModal()">返回</button> -->
        </div>

        <!-- 学习模式界面 -->
        <div class="study-screen" id="studyScreen">
            <div class="study-header">
                <div class="study-title" id="studyLibName">简单字库</div>
                <div class="study-progress" id="studyProgress">已认识：0 / 0</div>
            </div>
            
            <div class="study-grid" id="studyGrid"></div>
            
            <div class="page-bar">
                <button class="page-btn" onclick="prevPage()">上一页</button>
                <div class="page-info" id="pageInfo">第 1 页 / 共 1 页</div>
                <button class="page-btn" onclick="nextPage()">下一页</button>
            </div>
            
            <!-- <button style="margin-top:30px" class="fullBtn" onclick="showModal()">返回</button> -->
        </div>
    </div>

    <!-- 设置模态框（双TAB） -->
    <div class="modal" id="modal">
        <div class="modalContent">
            <div class="tab-bar">
                <div class="tab" onclick="switchTab('test')">测试模式</div>
                <div class="tab active" onclick="switchTab('study')">学习模式</div>
            </div>

            <!-- 测试模式 -->
            <div class="tab-pane" id="testPane">
                <label>选择字库</label>
                <select id="libSelect">
                    <option value="xiaoyang1">小羊上山 第1级</option>
                    <option value="hongen1">洪恩识字-启蒙篇</option>
                    <option value="xiaoyang2">小羊上山 第2级</option>
                    <option value="xiaoyang3">小羊上山 第3级</option>
                    <option value="xiaoyang4">小羊上山 第4级</option>
                    <option value="xiaoyang5">小羊上山 第5级</option>
                    <option value="xiaoyang6">小羊上山 第6级</option>
                    <option value="hongen2">洪恩识字-基础篇</option>
                    <option value="hongen3">洪恩识字-进阶篇</option>
                    <option value="hongen4">洪恩识字-提升篇</option>
                    <option value="hongen5">洪恩识字-精英篇</option>
                </select>
                <label>测试数量（不填=全部）</label>
                <input type="number" id="countInput" placeholder="默认测试全部汉字">
                <button class="startBtn" onclick="startGame()">开始测试</button>
            </div>

            <!-- 学习模式 -->
            <div class="tab-pane active" id="studyPane">
                <div class="study-total-box">
                    <div class="study-total-circle">
                        <div class="study-total-inner">
                            <div class="study-total-num" id="totalKnownNum">0</div>
                            <div class="study-total-text">总认识字数</div>
                        </div>
                    </div>
                </div>

                <label>选择字库</label>
                <select id="studyLibSelect">
                    <option value="xiaoyang1">小羊上山 第1级</option>
                    <option value="hongen1">洪恩识字-启蒙篇</option>
                    <option value="xiaoyang2">小羊上山 第2级</option>
                    <option value="xiaoyang3">小羊上山 第3级</option>
                    <option value="xiaoyang4">小羊上山 第4级</option>
                    <option value="xiaoyang5">小羊上山 第5级</option>
                    <option value="xiaoyang6">小羊上山 第6级</option>
                    <option value="hongen2">洪恩识字-基础篇</option>
                    <option value="hongen3">洪恩识字-进阶篇</option>
                    <option value="hongen4">洪恩识字-提升篇</option>
                    <option value="hongen5">洪恩识字-精英篇</option>
                </select>
                <button class="studyBtn" onclick="startStudy()">进入学习</button>
                <button class="clearStudyBtn" onclick="clearStudyRecord()">清空学习记录</button>
            </div>
        </div>
    </div>

        let currentList = [];
        let total = 0;
        let currentIndex = 0;
        let knowCount = 0;
        let wrongWords = [];
        let currentLibTotal = 0;
        let isAnimating = false;
        let studyRecord = JSON.parse(localStorage.getItem('studyRecord') || '{}');
        let circleTimer = null;

        let studyWords = [];
        let currentPage = 0;
        const pageSize = 20;

        // 初始化返回按钮
        const backBtn = document.getElementById('backBtn');
        backBtn.onclick = showModal;

        // TAB切换
        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`${type}Pane`).classList.add('active');
            
            if(type === 'study'){
                refreshTotalKnownCircleAnimate();
            }
        }

        // 打开设置
        function showModal() {
            if(isAnimating) return;
            backBtn.style.display = 'none';
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('studyScreen').style.display = 'none';
            document.body.classList.remove('study-mode-active');
            
            refreshTotalKnownCircleAnimate();
        }

        // 开始测试
        function startGame() {
            const lib = document.getElementById('libSelect').value;
            let inputCount = parseInt(document.getElementById('countInput').value);
            currentList = [...libraries[lib]];
            currentLibTotal = currentList.length;

            if (isNaN(inputCount) || inputCount < 1) {
                total = currentList.length;
            } else {
                total = Math.min(inputCount, currentList.length);
            }

            currentList.sort(() => Math.random() - 0.5);
            currentList = currentList.slice(0, total);

            currentIndex = 0;
            knowCount = 0;
            wrongWords = [];
            document.getElementById('modal').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            backBtn.style.display = 'flex';
            nextWord();
        }

        function nextWord() {
            if (currentIndex >= total) {
                showResult();
                return;
            }
            currentWord = currentList[currentIndex];
            document.getElementById('wordBox').innerText = currentWord;
            document.getElementById('progress').innerText = `第 ${currentIndex+1} / ${total} 字`;
        }

        function know() { knowCount++; nextStep(); }
        function unknown() { wrongWords.push(currentWord); nextStep(); }
        function nextStep() { currentIndex++; setTimeout(nextWord, 200); }

        // 显示结果
        function showResult() {
            isAnimating = true;
            document.getElementById('gameScreen').style.display = 'none';
            backBtn.style.display = 'flex';
            document.getElementById('resultScreen').style.display = 'block';

            document.getElementById('totalText').innerText = `本次测试：${total} 字`;
            document.getElementById('rateText').innerText = `认识：${knowCount} 字`;

            let rate = Math.round(knowCount / total * 100);
            let estimate = Math.round((knowCount / total) * currentLibTotal);

            let level = "";
            if (rate >= 90) level = "🌟 超级小学霸！";
            else if (rate >= 70) level = "😊 非常优秀！";
            else if (rate >= 50) level = "👍 继续加油！";
            else level = "💪 多练习更厉害！";

            document.getElementById('levelText').innerText = level;
            document.getElementById('wrongWordsBox').innerText = wrongWords.length > 0 ?
                "不认识的字：" + wrongWords.join(' ') : "🎉 全部认识！太棒了！";

            let numRate = document.getElementById('showRateNum');
            let numCount = document.getElementById('showCountNum');
            let circleDom = document.querySelector('.rate-circle');
            let count = 0;

            let timer = setInterval(() => {
                count++;
                numRate.innerText = count + "%";
                numCount.innerText = "预估 " + estimate + " 字";
                circleDom.style.background = `conic-gradient(#b666f2 ${count}%, #e8c8ff 0%)`;
                if (count >= rate) {
                    clearInterval(timer);
                    setTimeout(()=>{ isAnimating = false; }, 300);
                }
            }, 20);
        }

        // ==================== 学习模式 ====================
        function getUniqueKnownCount() {
            let allWords = [];
            Object.values(libraries).forEach(arr => allWords.push(...arr));
            let unique = [...new Set(allWords)];
            let cnt = 0;
            unique.forEach(w => { if (studyRecord[w]) cnt++; });
            return { cnt, total: unique.length };
        }

        // 超过800字自动清空
        function checkMaxKnownAndClear() {
            const { cnt } = getUniqueKnownCount();
            if (cnt >= 1500) {
                alert("识字数量已超过1500，为保证流畅运行，已自动清空学习记录");
                studyRecord = {};
                localStorage.setItem('studyRecord', JSON.stringify(studyRecord));
                refreshTotalKnownCircleAnimate();
            }
        }

        // 动画
        function refreshTotalKnownCircleAnimate() {
            checkMaxKnownAndClear();
            
            if (circleTimer) {
                clearInterval(circleTimer);
                circleTimer = null;
            }

            const { cnt, total } = getUniqueKnownCount();
            const numDom = document.getElementById('totalKnownNum');
            const circle = document.querySelector('.study-total-circle');
            let current = 0;
            let target = cnt;

            numDom.innerText = current;
            circleTimer = setInterval(() => {
                if (current < target) {
                    current++;
                }
                numDom.innerText = current;
                let pct = Math.round(current / total * 100);
                circle.style.background = `conic-gradient(#b666f2 ${pct}%, #e8c8ff 0%)`;
                
                if (current >= target) {
                    clearInterval(circleTimer);
                    circleTimer = null;
                }
            }, 18);
        }

        function startStudy() {
            const lib = document.getElementById('studyLibSelect').value;
            // 学习模式数组去重
            studyWords = [...new Set(libraries[lib])];
            const libName = {xiaoyang1:'小羊上山 第1级',xiaoyang2:'小羊上山 第2级',xiaoyang3:'小羊上山 第3级',xiaoyang4:'小羊上山 第4级',xiaoyang5:'小羊上山 第5级',xiaoyang6:'小羊上山 第6级',
            hongen1:'洪恩识字-启蒙篇',hongen2:'洪恩识字-基础篇',hongen3:'洪恩识字-进阶篇',hongen4:'洪恩识字-提升篇',hongen5:'洪恩识字-精英篇',}[lib];
            currentPage = 0;

            document.getElementById('modal').style.display = 'none';
            document.getElementById('studyScreen').style.display = 'flex';
            document.getElementById('studyLibName').innerText = libName;
            backBtn.style.display = 'flex';
            document.body.classList.add('study-mode-active');

            renderStudyPage();
        }

        function renderStudyPage() {
            const grid = document.getElementById('studyGrid');
            grid.innerHTML = '';
            let start = currentPage * pageSize;
            let end = start + pageSize;
            let pageWords = studyWords.slice(start, end);
            let totalPages = Math.ceil(studyWords.length / pageSize);

            pageWords.forEach(word => {
                const known = studyRecord[word] || false;
                const item = document.createElement('div');
                item.className = 'study-word';
                if (known) item.classList.add('known');
                item.innerText = word;

                item.onclick = () => {
                    studyRecord[word] = !studyRecord[word];
                    localStorage.setItem('studyRecord', JSON.stringify(studyRecord));
                    item.classList.toggle('known');
                    refreshStudyProgress();
                    refreshTotalKnownCircleAnimate();
                };

                grid.appendChild(item);
            });

            document.getElementById('pageInfo').innerText = `第 ${currentPage+1} 页 / 共 ${totalPages} 页`;
            refreshStudyProgress();
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderStudyPage();
            }
        }

        function nextPage() {
            let totalPages = Math.ceil(studyWords.length / pageSize);
            if (currentPage + 1 < totalPages) {
                currentPage++;
                renderStudyPage();
            }
        }

        function refreshStudyProgress() {
            let cnt = 0;
            studyWords.forEach(w => { if(studyRecord[w]) cnt++; });
            document.getElementById('studyProgress').innerText = `已认识：${cnt} / ${studyWords.length}`;
        }

        function clearStudyRecord() {
            if(!confirm('确定要清空所有学习记录吗？')) return;
            studyRecord = {};
            localStorage.setItem('studyRecord', JSON.stringify(studyRecord));
            refreshTotalKnownCircleAnimate();
        }

        window.onload = showModal;
    </script>
